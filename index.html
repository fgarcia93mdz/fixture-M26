<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <title>🏆 Mundial 2026</title>
  <style>
    :root {
      --bg:          #0d1b2a;
      --bg2:         #111f33;
      --card:        #172740;
      --card-hover:  #1e3050;
      --accent:      #c9a84c;
      --accent2:     #e8c96a;
      --text:        #edf2f7;
      --text2:       #8fa3c0;
      --text3:       #4e6a8a;
      --border:      #263d5c;
      --green:       #22c55e;
      --yellow:      #f59e0b;
      --red:         #ef4444;
      --r-sm:        5px;
      --r-md:        10px;
      --r-lg:        14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--bg2);
      border-bottom: 2px solid var(--accent);
      padding: 18px 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
    }
    .header-title span { color: var(--accent); }
    .header-sub {
      font-size: 0.7rem;
      color: var(--text3);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    .tabs {
      display: flex;
      background: var(--bg2);
      border-radius: var(--r-lg);
      padding: 4px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: var(--r-md);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .tab-btn:hover:not(.activo) {
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .tab-btn.activo { background: var(--accent); color: #0d1b2a; }
    .filtros {
      background: var(--bg2);
      border-radius: var(--r-lg);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      display: none;
    }
    .filtros.visible { display: block; }
    .filtros-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }
    .btn-fase {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-fase:hover { border-color: var(--accent); color: var(--accent); }
    .btn-fase.activo { background: var(--accent); border-color: var(--accent); color: #0d1b2a; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
    }
    .toolbar-info { font-size: 12px; color: var(--text3); }
    .toolbar-info .edited-mark { color: var(--accent); font-weight: 700; }
    .toolbar-actions { display: flex; gap: 6px; }
    .btn-tool {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: var(--r-sm);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-tool:hover { border-color: var(--accent); color: var(--accent); }
    .btn-tool.danger:hover { border-color: var(--red); color: var(--red); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.25s ease both;
    }
    .card:hover {
      border-color: rgba(201,168,76,0.35);
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    }
    .card.editado { border-left: 3px solid var(--accent); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border);
    }
    .card-fase {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .card-fecha { font-size: 11px; color: var(--text3); }
    .card-body { padding: 14px 16px; }
    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .match-equipo {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .match-equipo.local    { text-align: right; }
    .match-equipo.visitante{ text-align: left; }
    .match-score {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 14px;
      font-size: 22px;
      font-weight: 900;
      color: var(--text2);
      letter-spacing: 3px;
      min-width: 84px;
      text-align: center;
      flex-shrink: 0;
    }
    .match-score.definido {
      background: rgba(201,168,76,0.08);
      border-color: rgba(201,168,76,0.4);
      color: var(--accent);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
    }
    .status-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-pendiente  { background: rgba(245,158,11,0.12); color: var(--yellow); }
    .status-finalizado { background: rgba(34,197,94,0.12);  color: var(--green); }
    .status-en-vivo    { background: rgba(239,68,68,0.15);  color: var(--red); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .card-footer-right { display: flex; align-items: center; gap: 8px; }
    .edited-label {
      font-size: 10px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-edit {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text3);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.oculto { display: none; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: var(--r-lg);
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .modal-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .modal-match {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 22px;
      line-height: 1.3;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 7px;
    }
    .field input, .field select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--bg2); }
    .score-row { display: flex; gap: 10px; align-items: center; }
    .score-row input { text-align: center; font-size: 22px; font-weight: 800; }
    .score-sep { font-size: 22px; font-weight: 800; color: var(--text3); }
    .modal-actions { display: flex; gap: 8px; margin-top: 22px; }
    .btn-m {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: var(--r-md);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn-m-primary   { background: var(--accent); color: #0d1b2a; }
    .btn-m-primary:hover { background: var(--accent2); }
    .btn-m-secondary { background: var(--card); color: var(--text2); border: 1px solid var(--border); }
    .btn-m-secondary:hover { color: var(--text); }
    .btn-m-danger    { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
    .btn-m-danger:hover { background: rgba(239,68,68,0.22); }
    .tabla-wrapper { animation: fadeUp 0.25s ease; }
    .tabla-grupo {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .tabla-titulo {
      background: rgba(201,168,76,0.08);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 12px 16px;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
    }
    .tabla-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 540px; }
    th {
      padding: 9px 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text3);
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 6px;
      text-align: center;
      color: var(--text2);
      border-bottom: 1px solid rgba(38,61,92,0.5);
      font-size: 13px;
    }
    tr:last-child td { border-bottom: none; }
    .td-equipo { font-weight: 700; color: var(--text); text-align: left; padding-left: 14px; }
    .td-pos    { font-weight: 700; color: var(--text3); }
    .td-pts    { font-weight: 900; color: var(--text); }
    .row-top   { background: rgba(34,197,94,0.05); }
    .row-top .td-pos { color: var(--green); }
    .row-rep   { background: rgba(245,158,11,0.05); }
    .row-rep .td-pos { color: var(--yellow); }
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text3);
      font-size: 13px;
    }
    .empty-state strong { display: block; font-size: 15px; color: var(--text2); margin-bottom: 6px; }
    .loading-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text2);
      font-size: 14px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--r-md);
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      z-index: 300;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast.oculto { opacity: 0; transform: translateY(12px); pointer-events: none; }
    /* ── Bracket eliminatorias ─────────────────────────────────── */
    .bracket-wrap {
      overflow-x: auto;
      padding-bottom: 20px;
    }
    .bracket {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 900px;
      padding: 24px 0;
    }
    .bracket-round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      flex: 1;
      min-width: 148px;
      position: relative;
    }
    .bracket-round-title {
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text3);
      margin-bottom: 10px;
      position: sticky;
      top: 0;
    }
    .bracket-match {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      margin: 6px 4px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .bracket-match:hover {
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .bracket-match.editado { border-left: 2px solid var(--accent); }
    .bracket-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
      gap: 6px;
    }
    .bracket-team:last-child { border-bottom: none; }
    .bracket-team.winner { color: var(--text); background: rgba(201,168,76,0.06); }
    .bracket-team-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bracket-team-score {
      font-size: 12px;
      font-weight: 900;
      color: var(--accent);
      min-width: 16px;
      text-align: right;
    }
    .bracket-match-info {
      font-size: 9px;
      color: var(--text3);
      padding: 3px 9px 4px;
      background: rgba(0,0,0,0.2);
      text-align: center;
    }
    /* Copa central */
    .bracket-trophy {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      gap: 6px;
      flex-shrink: 0;
    }
    .trophy-icon {
      font-size: 36px;
      filter: drop-shadow(0 0 10px rgba(201,168,76,0.5));
    }
    .trophy-label {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      text-align: center;
    }
    /* Connectors */
    .bracket-connector {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 20px;
      flex-shrink: 0;
    }
    /* Recordatorio btn */
    .btn-reminder {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text3);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .btn-reminder:hover { border-color: #60a5fa; color: #60a5fa; }
    /* Grupos agrupados */
    .grupo-section {
      margin-bottom: 10px;
    }
    .grupo-section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text3);
      padding: 8px 0 6px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      /* Header */
      .header        { padding: 13px 16px; }
      .header-title  { font-size: 1.1rem; letter-spacing: 2px; }
      .header-sub    { letter-spacing: 2.5px; }

      /* Main padding */
      .main { padding: 12px 10px 60px; }

      /* Tabs */
      .tab-btn { font-size: 11px; padding: 8px 10px; letter-spacing: 1px; }

      /* Filtros */
      .filtros  { padding: 12px; }
      .btn-fase { font-size: 11px; padding: 5px 10px; }

      /* Toolbar */
      .toolbar         { flex-direction: column; align-items: flex-start; gap: 10px; }
      .toolbar-actions { flex-wrap: wrap; }
      .btn-tool        { flex: 1; min-width: 70px; text-align: center; }

      /* Cards */
      .card-header { flex-direction: column; align-items: flex-start; gap: 3px; }
      .card-body   { padding: 12px 12px; }
      .card-footer { padding: 8px 12px; }

      /* Match row - stack vertically en pantallas muy chicas */
      .match-row        { flex-direction: column; gap: 8px; align-items: center; }
      .match-equipo     { font-size: 15px; text-align: center !important; flex: none; width: 100%; }
      .match-score      { font-size: 20px; padding: 6px 18px; min-width: 0; order: -1; }

      /* Tabla */
      th, td { padding: 7px 4px; font-size: 11px; }

      /* Modal */
      .modal { padding: 18px 16px; }
      .modal-match { font-size: 15px; }
      .btn-m { font-size: 11px; padding: 9px 6px; }
    }

    @media (max-width: 380px) {
      .header-title { font-size: 0.95rem; }
      .tab-btn      { font-size: 10px; letter-spacing: 0.5px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">MUNDIAL</span> 2026</div>
  <div class="header-sub">Fixture &mdash; PS5 Edition</div>
</header>

<div class="main">

  <div class="tabs" role="tablist">
    <button class="tab-btn activo" data-vista="fixture" role="tab">Fixture</button>
    <button class="tab-btn" data-vista="tabla" role="tab">Tabla de Posiciones</button>
  </div>

  <!-- Tabs extra: bracket para vista eliminatorias -->
  <div id="tabs-bracket" style="display:none;" class="tabs" role="tablist">
    <button class="tab-btn activo" data-subtab="lista">Lista</button>
    <button class="tab-btn" data-subtab="bracket">Llaves</button>
  </div>

  <div class="filtros" id="filtros-fixture">
    <div class="filtros-row" id="filtros-fase">
      <button class="btn-fase activo" data-filtro="todos">Todos</button>
      <button class="btn-fase" data-filtro="Grupo">Fase de Grupos</button>
      <button class="btn-fase" data-filtro="Ronda32">Ronda de 32</button>
      <button class="btn-fase" data-filtro="Octavos">Octavos</button>
      <button class="btn-fase" data-filtro="Cuartos">Cuartos</button>
      <button class="btn-fase" data-filtro="Semifinal">Semifinales</button>
      <button class="btn-fase" data-filtro="Final">Final</button>
    </div>

    <div class="filtros-row" id="filtro-grupos" style="display:none;">
      <button class="btn-fase activo" data-grupo="todos">Todos</button>
      <button class="btn-fase" data-grupo="A">A</button>
      <button class="btn-fase" data-grupo="B">B</button>
      <button class="btn-fase" data-grupo="C">C</button>
      <button class="btn-fase" data-grupo="D">D</button>
      <button class="btn-fase" data-grupo="E">E</button>
      <button class="btn-fase" data-grupo="F">F</button>
      <button class="btn-fase" data-grupo="G">G</button>
      <button class="btn-fase" data-grupo="H">H</button>
      <button class="btn-fase" data-grupo="I">I</button>
      <button class="btn-fase" data-grupo="J">J</button>
      <button class="btn-fase" data-grupo="K">K</button>
      <button class="btn-fase" data-grupo="L">L</button>
    </div>

    <div class="toolbar">
      <span class="toolbar-info" id="toolbar-info">Cargando...</span>
      <div class="toolbar-actions">
        <button class="btn-tool" id="btn-export" title="Exportar modificaciones locales como archivo JSON">Exportar</button>
        <button class="btn-tool" id="btn-import" title="Restaurar modificaciones desde un archivo JSON">Importar</button>
        <button class="btn-tool danger" id="btn-reset" title="Borrar todas las modificaciones guardadas localmente">Resetear</button>
        <input type="file" id="file-import" accept=".json" style="display:none;">
      </div>
    </div>
  </div>

  <div id="contenido"></div>

</div>

<div class="modal-overlay oculto" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-label">Editar resultado</div>
    <div class="modal-match" id="modal-match-title"></div>
    <div class="field">
      <label>Goles</label>
      <div class="score-row">
        <input type="number" id="modal-g1" min="0" max="99" placeholder="0">
        <span class="score-sep">:</span>
        <input type="number" id="modal-g2" min="0" max="99" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label>Estado</label>
      <select id="modal-estado">
        <option value="Pendiente">Pendiente</option>
        <option value="En Vivo">En Vivo</option>
        <option value="Finalizado">Finalizado</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-m btn-m-danger"    id="btn-m-borrar">Borrar</button>
      <button class="btn-m btn-m-secondary" id="btn-m-cancelar">Cancelar</button>
      <button class="btn-m btn-m-primary"   id="btn-m-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast oculto" id="toast" role="status" aria-live="polite"></div>

<script>
const URL_FIXTURE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTI-SJcBOdYUf0BOGWuKNRYyofLFBZdDdYlTNjklAg7UYVjI_rHuheHtFyvLTH8rw/pub?gid=534628115&single=true&output=csv";
const URL_TABLA   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTI-SJcBOdYUf0BOGWuKNRYyofLFBZdDdYlTNjklAg7UYVjI_rHuheHtFyvLTH8rw/pub?gid=30061453&single=true&output=csv";
const LS_FIXTURE  = "adn_fixture_cache";
const LS_TABLA    = "adn_tabla_cache";
const LS_EDITS    = "adn_fixture_edits";
const CACHE_TTL   = 10 * 60 * 1000;

let partidos    = [];
let tablas      = {};
let vistaActual = "fixture";
let filtroActual= "todos";
let grupoActual = "todos";
let modalId     = null;

function getEdits() {
  try { return JSON.parse(localStorage.getItem(LS_EDITS) || "{}"); } catch { return {}; }
}
function saveEdits(e) { localStorage.setItem(LS_EDITS, JSON.stringify(e)); }
function getCache(k) {
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return Date.now() - p.ts > CACHE_TTL ? null : p.data;
  } catch { return null; }
}
function setCache(k, d) { localStorage.setItem(k, JSON.stringify({ data: d, ts: Date.now() })); }

function mId(p) { return (p.equipo1+"|"+p.equipo2+"|"+p.fecha).toLowerCase().replace(/\s+/g,"_"); }

function clean(t) {
  if (!t) return "";
  return t.replace(/\r?\n|\r/g," ").replace(/\s+/g," ").replace(/[*_]/g,"").trim();
}
function parseCSV(texto) {
  texto = texto.replace(/^\uFEFF/,"");
  const lines = texto.trim().split(/\r?\n/), filas = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const vals = []; let inQ=false, cur="";
    for (const ch of line) {
      if (ch==='"') { inQ=!inQ; }
      else if (ch===','&&!inQ) { vals.push(clean(cur)); cur=""; }
      else { cur+=ch; }
    }
    vals.push(clean(cur));
    if (vals.some(v=>v!=="")) filas.push(vals);
  }
  return filas;
}

async function cargarFixture() {
  const cached = getCache(LS_FIXTURE);
  if (cached) { partidos = cached; return true; }
  try {
    const filas = parseCSV(await (await fetch(URL_FIXTURE)).text());
    if (filas.length < 2) throw new Error("Sin datos");
    const h = filas[0];
    partidos = filas.slice(1).map(f => { const o={}; h.forEach((k,i)=>{o[clean(k)]=f[i]||"";}); return o; });
    setCache(LS_FIXTURE, partidos);
    return true;
  } catch(e) { console.error("Error fixture:",e); return false; }
}

async function cargarTabla() {
  const cached = getCache(LS_TABLA);
  if (cached) { tablas = cached; return true; }
  try {
    const filas = parseCSV(await (await fetch(URL_TABLA)).text());
    if (filas.length < 2) return false;
    const headers = filas[0].map(h=>h.toLowerCase().trim());
    const datos = [];
    for (let i=1;i<filas.length;i++) {
      const f=filas[i]; if(f.length<2) continue;
      const o={}; headers.forEach((h,idx)=>{if(idx<f.length) o[h]=clean(f[idx]);}); 
      if(o.grupo&&o.equipo) datos.push(o);
    }
    tablas={};
    datos.forEach(row=>{
      const g=(row.grupo||"A").toString().toUpperCase().replace(/[^A-Z]/g,"")||"A";
      if(!tablas[g]) tablas[g]=[];
      tablas[g].push({ equipo:row.equipo||"Sin nombre", pj:row.pj||"0", pg:row.pg||"0",
        pe:row.pe||"0", pp:row.pp||"0", gf:row.gf||"0", gc:row.gc||"0",
        dif:row.dg||row.dif||"0", puntos:row.pts||row.puntos||"0" });
    });
    for (const g in tablas) {
      tablas[g].sort((a,b)=>{
        const d=(parseInt(b.puntos)||0)-(parseInt(a.puntos)||0);
        return d!==0?d:(parseInt(b.dif)||0)-(parseInt(a.dif)||0);
      });
      tablas[g].forEach((e,i)=>{e.pos=i+1;});
    }
    setCache(LS_TABLA, tablas);
    return true;
  } catch(e) { console.error("Error tabla:",e); return false; }
}

// ─── Ordenamiento ───────────────────────────────────────────────────────────
const ORDEN_FASE = { "grupo":0, "ronda32":1, "ronda de 32":1, "dieciseisavos":1,
  "octavos":2, "cuartos":3, "semifinal":4, "final":5 };

function fasePeso(p) {
  const f = (p.fase||"").toLowerCase();
  for (const k in ORDEN_FASE) { if (f.includes(k)) return ORDEN_FASE[k]; }
  return 99;
}

function parseFecha(s) {
  if (!s) return Infinity;
  // Intentar parsear fecha en formato dd/mm/yyyy, dd-mm-yyyy, o yyyy-mm-dd
  const d1 = s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if (d1) return new Date(d1[3].length===2?"20"+d1[3]:d1[3], d1[2]-1, d1[1]).getTime();
  const d2 = s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (d2) return new Date(d2[1], d2[2]-1, d2[3]).getTime();
  // Fechas tipo "11 Jun" o "11 junio"
  const meses = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,
    jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const d3 = s.toLowerCase().match(/(\d{1,2})\s+([a-z]{3})/);
  if (d3 && meses[d3[2]]!==undefined) return new Date(2026, meses[d3[2]], parseInt(d3[1])).getTime();
  return Infinity;
}

function ordenarPartidos(arr) {
  return [...arr].sort((a,b) => {
    const fp = fasePeso(a) - fasePeso(b);
    if (fp !== 0) return fp;
    // Dentro de grupos: ordenar por grupo luego fecha
    if (fasePeso(a) === 0) {
      const ga = (a.grupo||"Z").toUpperCase();
      const gb = (b.grupo||"Z").toUpperCase();
      if (ga !== gb) return ga < gb ? -1 : 1;
    }
    return parseFecha(a.fecha) - parseFecha(b.fecha);
  });
}

// ─── ICS / Recordatorio ───────────────────────────────────────────────────────
function parseHora(h) {
  if (!h) return null;
  const m = h.match(/(\d{1,2}):(\d{2})/);
  return m ? { hh: m[1].padStart(2,'0'), mm: m[2] } : null;
}

function generarICS(p) {
  const e1 = p.equipo1 || "Equipo A";
  const e2 = p.equipo2 || "Equipo B";
  const titulo = `Mundial 2026 - ${e1} vs. ${e2}`;
  const desc   = `${p.fase||""} ${p.grupo?"Grupo "+p.grupo:""}`.trim();
  const sede   = p.sede || p.estadio || "";

  const fts = parseFecha(p.fecha);
  const ht  = parseHora(p.hora);
  let dtStart, dtEnd;

  if (fts !== Infinity) {
    const d = new Date(fts);
    const y = d.getFullYear();
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    if (ht) {
      // Convertir hora (asumimos hora local Argentina UTC-3)
      dtStart = `${y}${mo}${dd}T${ht.hh}${ht.mm}00`;
      // Duración 2hs
      const endH = String(parseInt(ht.hh)+2).padStart(2,'0');
      dtEnd   = `${y}${mo}${dd}T${endH}${ht.mm}00`;
    } else {
      dtStart = `${y}${mo}${dd}`;
      dtEnd   = `${y}${mo}${dd}`;
    }
  } else {
    toast("No hay fecha disponible para este partido");
    return;
  }

  const uid = mId(p).replace(/[^a-z0-9]/g,'') + "@mundial";
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Mundial 2026//ES",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTART${ht?"":';VALUE=DATE'}:${dtStart}`,
    `DTEND${ht?"":';VALUE=DATE'}:${dtEnd}`,
    `SUMMARY:${titulo}`,
    `DESCRIPTION:${desc}`,
    `LOCATION:${sede}`,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Recordatorio",
    "TRIGGER:-PT30M",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `${e1.replace(/\s+/g,'_')}_vs_${e2.replace(/\s+/g,'_')}.ics`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("Recordatorio descargado — abrilo para agregar al calendario");
}

// ─── Bracket ─────────────────────────────────────────────────────────────────
const BRACKET_FASES = ["ronda32", "octavos", "cuartos", "semifinal", "final"];
const BRACKET_LABELS = {
  ronda32:   "Ronda de 32",
  octavos:   "Octavos",
  cuartos:   "Cuartos",
  semifinal: "Semifinales",
  final:     "Final"
};

function getFaseBracket(p) {
  const f = (p.fase||"").toLowerCase();
  if (f.includes("ronda 32")||f.includes("ronda de 32")||f.includes("dieciseisavos")||f.includes("32avos")||f.includes("ronda32")) return "ronda32";
  if (f.includes("octavos"))   return "octavos";
  if (f.includes("cuartos"))   return "cuartos";
  if (f.includes("semifinal")) return "semifinal";
  if (f.includes("final"))     return "final";
  return null;
}

let subtabActual = "lista";

function mostrarBracketTabs(show) {
  document.getElementById("tabs-bracket").style.display = show ? "flex" : "none";
}

function renderBracketMatch(p) {
  const edits = getEdits();
  const id    = mId(p);
  const edit  = edits[id];
  const g1    = edit ? edit.g1 : (p.goles1||"–");
  const g2    = edit ? edit.g2 : (p.goles2||"–");
  const hasScore = g1 !== "–" && g1 !== "" && g1 !== "-" && g2 !== "–" && g2 !== "" && g2 !== "-";
  const w1 = hasScore && parseInt(g1) > parseInt(g2);
  const w2 = hasScore && parseInt(g2) > parseInt(g1);
  const eNombre1 = esc(p.equipo1||"Por definir");
  const eNombre2 = esc(p.equipo2||"Por definir");
  const fecha    = p.fecha || "";
  const hora     = p.hora  || "";
  const info     = [fecha, hora].filter(Boolean).join(" · ") || "Fecha por confirmar";

  return `<div class="bracket-match${edit?' editado':''}" data-id="${esc(id)}">
    <div class="bracket-team${w1?' winner':''}">
      <span class="bracket-team-name">${eNombre1}</span>
      <span class="bracket-team-score">${hasScore?g1:''}</span>
    </div>
    <div class="bracket-team${w2?' winner':''}">
      <span class="bracket-team-name">${eNombre2}</span>
      <span class="bracket-team-score">${hasScore?g2:''}</span>
    </div>
    <div class="bracket-match-info">${info}</div>
  </div>`;
}

function mostrarBracket() {
  const container = document.getElementById("contenido");
  const edits     = getEdits();

  // Clasificar partidos por fase
  const byFase = {};
  BRACKET_FASES.forEach(f => { byFase[f] = []; });
  partidos.forEach(p => {
    const f = getFaseBracket(p);
    if (f) byFase[f].push(p);
  });

  // Determinar qué fases tienen partidos
  const fasesConPartidos = BRACKET_FASES.filter(f => byFase[f].length > 0);

  if (fasesConPartidos.length === 0) {
    container.innerHTML = '<div class="empty-state"><strong>Sin datos</strong>No hay partidos de fase eliminatoria aún.</div>';
    return;
  }

  // Mitad izquierda y derecha del bracket
  const idxFinal = fasesConPartidos.indexOf("final");
  const fasesIzq = fasesConPartidos.filter(f => f !== "final");
  // Dividir fases en izq (primera mitad) y der (segunda mitad) para el efecto espejo
  const mitad = Math.ceil(fasesIzq.length / 2);
  const izq   = fasesIzq.slice(0, mitad);
  const der   = fasesIzq.slice(mitad).reverse();

  let html = '<div class="bracket-wrap"><div class="bracket">';

  // Columnas izquierda
  izq.forEach(fase => {
    html += `<div class="bracket-round">`;
    html += `<div class="bracket-round-title">${BRACKET_LABELS[fase]||fase}</div>`;
    byFase[fase].slice(0, Math.ceil(byFase[fase].length/2)).forEach(p => {
      html += renderBracketMatch(p);
    });
    html += `</div>`;
  });

  // Copa central
  const finalPartido = byFase["final"][0];
  html += `<div class="bracket-round" style="min-width:160px">`;
  html += `<div class="bracket-round-title">Final</div>`;
  if (finalPartido) {
    html += renderBracketMatch(finalPartido);
  }
  html += `<div class="bracket-trophy"><div class="trophy-icon">🏆</div><div class="trophy-label">Mundial<br>2026</div></div>`;
  html += `</div>`;

  // Columnas derecha (espejo)
  der.forEach(fase => {
    html += `<div class="bracket-round">`;
    html += `<div class="bracket-round-title">${BRACKET_LABELS[fase]||fase}</div>`;
    byFase[fase].slice(Math.floor(byFase[fase].length/2)).forEach(p => {
      html += renderBracketMatch(p);
    });
    html += `</div>`;
  });

  html += '</div></div>';
  container.innerHTML = html;

  // Eventos editar en bracket
  container.querySelectorAll(".bracket-match").forEach(el => {
    el.addEventListener("click", () => abrirModal(el.dataset.id));
  });
}

function filtrar() {
  let out=partidos;
  if (filtroActual!=="todos") {
    if (filtroActual==="Grupo") {
      out=out.filter(p=>(p.fase||"").toLowerCase().includes("grupo"));
    } else if (filtroActual==="Ronda32") {
      out=out.filter(p=>{const f=(p.fase||"").toLowerCase();
        return f.includes("ronda 32")||f.includes("ronda de 32")||f.includes("dieciseisavos")||f.includes("32avos")||f.includes("ronda32");});
    } else {
      out=out.filter(p=>(p.fase||"").toLowerCase().includes(filtroActual.toLowerCase()));
    }
  }
  if (grupoActual!=="todos"&&filtroActual==="Grupo")
    out=out.filter(p=>(p.grupo||"").toUpperCase()===grupoActual.toUpperCase());
  return out;
}

function estadoClass(est) {
  const e=(est||"").toLowerCase();
  if (e.includes("finalizado")||e.includes("terminado")) return "status-finalizado";
  if (e.includes("vivo")||e.includes("directo")||e.includes("curso")) return "status-en-vivo";
  return "status-pendiente";
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function mostrarFixture() {
  const contenedor = document.getElementById("contenido");
  const infoEl     = document.getElementById("toolbar-info");
  const edits      = getEdits();
  const filtrados  = filtrar();
  const ne         = Object.keys(edits).length;

  let info = filtrados.length+" partido"+(filtrados.length!==1?"s":"");
  const labels={Grupo:"Fase de Grupos",Ronda32:"Ronda de 32",Octavos:"Octavos",Cuartos:"Cuartos",Semifinal:"Semifinales",Final:"Final"};
  if (filtroActual!=="todos") info+=" &mdash; "+(labels[filtroActual]||filtroActual);
  if (grupoActual!=="todos"&&filtroActual==="Grupo") info+=" &middot; Grupo "+grupoActual;
  if (ne>0) info+=" &mdash; <span class='edited-mark'>"+ne+" editado"+(ne!==1?"s":"")+" localmente</span>";
  infoEl.innerHTML=info;

  if (filtrados.length===0) {
    contenedor.innerHTML='<div class="empty-state"><strong>Sin partidos</strong>No hay partidos para esta selección.</div>';
    return;
  }

  contenedor.innerHTML="";
  // Ordenar siempre
  const ordenados = ordenarPartidos(filtrados);

  // Si es vista "todos" agrupar por grupo visualmente
  if (filtroActual === "todos" || filtroActual === "Grupo") {
    const secciones = {};
    const ordenSec  = [];
    ordenados.forEach(p => {
      let sec;
      if (fasePeso(p) === 0) {
        sec = "Grupo " + (p.grupo || "?").toUpperCase();
      } else {
        const labels={0:"Fase de Grupos",1:"Ronda de 32",2:"Octavos de Final",3:"Cuartos de Final",4:"Semifinales",5:"Final"};
        sec = labels[fasePeso(p)] || p.fase || "Otros";
      }
      if (!secciones[sec]) { secciones[sec]=[]; ordenSec.push(sec); }
      secciones[sec].push(p);
    });

    let secIdx = 0;
    ordenSec.forEach(sec => {
      const secDiv = document.createElement("div");
      secDiv.className = "grupo-section";
      secDiv.innerHTML = `<div class="grupo-section-title">${sec}</div>`;
      contenedor.appendChild(secDiv);
      secciones[sec].forEach((p, i) => {
        secDiv.appendChild(buildCard(p, secIdx++, edits));
      });
    });
  } else {
    ordenados.forEach((p, i) => {
      contenedor.appendChild(buildCard(p, i, edits));
    });
  }

  contenedor.querySelectorAll(".btn-edit").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); abrirModal(btn.dataset.id); });
  });
  contenedor.querySelectorAll(".btn-reminder").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const p  = partidos.find(x => mId(x) === id);
      if (p) generarICS(p);
    });
  });
}

function buildCard(p, i, edits) {
  const id    = mId(p), edit = edits[id];
  const g1    = edit ? edit.g1    : (p.goles1||"");
  const g2    = edit ? edit.g2    : (p.goles2||"");
  const est   = edit ? edit.estado: (p.estado||"Pendiente");
  const has   = g1!==""&&g1!=="-"&&g2!==""&&g2!=="-";
  const scoreText = has ? g1+" : "+g2 : "&ndash; : &ndash;";
  const scoreK    = has ? "match-score definido" : "match-score";
  const faseL     = p.fase ? (p.grupo ? p.fase+" &middot; Grupo "+p.grupo : p.fase) : "Partido";
  const sede      = p.sede || p.estadio || "";
  const fechaL    = [p.fecha, p.hora, sede].filter(Boolean).join(" · ") || "Fecha por confirmar";

  const card = document.createElement("div");
  card.className = "card"+(edit?" editado":"");
  card.style.animationDelay = i*0.025+"s";
  card.innerHTML=`
    <div class="card-header">
      <span class="card-fase">${faseL}</span>
      <span class="card-fecha">${fechaL}</span>
    </div>
    <div class="card-body">
      <div class="match-row">
        <div class="match-equipo local">${esc(p.equipo1)||"Por definir"}</div>
        <div class="${scoreK}">${scoreText}</div>
        <div class="match-equipo visitante">${esc(p.equipo2)||"Por definir"}</div>
      </div>
    </div>
    <div class="card-footer">
      <span class="status-badge ${estadoClass(est)}">${esc(est)}</span>
      <div class="card-footer-right">
        ${edit?'<span class="edited-label">Editado</span>':""}
        <button class="btn-reminder" data-id="${esc(id)}" title="Agregar al calendario">+ Cal</button>
        <button class="btn-edit" data-id="${esc(id)}">Editar</button>
      </div>
    </div>`;
  return card;
}

function mostrarTabla() {
  const container=document.getElementById("contenido");
  const grupos=Object.keys(tablas).sort();
  if (grupos.length===0) {
    container.innerHTML='<div class="empty-state"><strong>Sin datos</strong>No hay tabla de posiciones disponible.</div>';
    return;
  }
  let html='<div class="tabla-wrapper">';
  grupos.forEach(g=>{
    const equipos=tablas[g];
    html+=`<div class="tabla-grupo"><div class="tabla-titulo">Grupo ${g}</div><div class="tabla-scroll"><table>
      <thead><tr><th>Pos</th><th style="text-align:left;padding-left:14px">Equipo</th>
      <th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>`;
    equipos.forEach((eq,idx)=>{
      const rc=idx<2?"row-top":(idx===2?"row-rep":"");
      html+=`<tr class="${rc}"><td class="td-pos">${eq.pos}</td><td class="td-equipo">${esc(eq.equipo)}</td>
        <td>${eq.pj}</td><td>${eq.pg}</td><td>${eq.pe}</td><td>${eq.pp}</td>
        <td>${eq.gf}</td><td>${eq.gc}</td><td>${eq.dif}</td><td class="td-pts">${eq.puntos}</td></tr>`;
    });
    html+="</tbody></table></div></div>";
  });
  html+="</div>";
  container.innerHTML=html;
}

function abrirModal(id) {
  modalId=id;
  const p=partidos.find(x=>mId(x)===id);
  if (!p) return;
  const edits=getEdits(), edit=edits[id];
  document.getElementById("modal-match-title").textContent=(p.equipo1||"?")+' vs. '+(p.equipo2||"?");
  document.getElementById("modal-g1").value=edit?edit.g1:(p.goles1&&p.goles1!=="-"?p.goles1:"");
  document.getElementById("modal-g2").value=edit?edit.g2:(p.goles2&&p.goles2!=="-"?p.goles2:"");
  const sel=document.getElementById("modal-estado");
  sel.value=edit?edit.estado:(p.estado||"Pendiente");
  if (!sel.value) sel.value="Pendiente";
  document.getElementById("modal-overlay").classList.remove("oculto");
  document.getElementById("modal-g1").focus();
}
function cerrarModal() {
  document.getElementById("modal-overlay").classList.add("oculto");
  modalId=null;
}
function guardarModal() {
  if (!modalId) return;
  const g1=document.getElementById("modal-g1").value.trim();
  const g2=document.getElementById("modal-g2").value.trim();
  const estado=document.getElementById("modal-estado").value;
  const edits=getEdits();
  edits[modalId]={g1:g1!==""?g1:"-",g2:g2!==""?g2:"-",estado};
  saveEdits(edits); cerrarModal(); mostrarFixture(); toast("Resultado guardado localmente");
}
function borrarEdicion() {
  if (!modalId) return;
  const edits=getEdits(); delete edits[modalId];
  saveEdits(edits); cerrarModal(); mostrarFixture(); toast("Edicion borrada");
}

let toastTimer=null;
function toast(msg) {
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.remove("oculto");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("oculto"),2800);
}

function exportar() {
  const edits=getEdits(), count=Object.keys(edits).length;
  if (count===0) { toast("No hay modificaciones para exportar"); return; }
  const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),torneo:"Mundial 2026",edits},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="mundial-edits-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast(count+" modificaciones exportadas");
}
function importar(file) {
  const reader=new FileReader();
  reader.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      const incoming=data.edits||data;
      if (typeof incoming!=="object"||Array.isArray(incoming)) throw new Error();
      const merged=Object.assign(getEdits(),incoming);
      saveEdits(merged); mostrarFixture();
      toast(Object.keys(incoming).length+" modificaciones importadas");
    } catch { toast("Error: archivo invalido"); }
  };
  reader.readAsText(file);
}
function resetear() {
  const count=Object.keys(getEdits()).length;
  if (count===0) { toast("No hay modificaciones guardadas"); return; }
  if (!confirm("Borrar las "+count+" modificaciones guardadas localmente? Esta accion no se puede deshacer.")) return;
  saveEdits({}); mostrarFixture(); toast("Modificaciones borradas");
}

function configurarEventos() {
  document.querySelectorAll("[data-vista]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll("[data-vista]").forEach(b=>b.classList.remove("activo"));
      btn.classList.add("activo"); vistaActual=btn.dataset.vista;
      const esFix = vistaActual==="fixture";
      document.getElementById("filtros-fixture").classList.toggle("visible", esFix);
      document.getElementById("tabs-bracket").style.display = "none";
      subtabActual = "lista";
      document.querySelectorAll("[data-subtab]").forEach(b => {
        b.classList.toggle("activo", b.dataset.subtab === "lista");
      });
      esFix ? mostrarFixture() : mostrarTabla();
    });
  });
  document.querySelectorAll("[data-filtro]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll("[data-filtro]").forEach(b=>b.classList.remove("activo"));
      btn.classList.add("activo"); filtroActual=btn.dataset.filtro;
      document.getElementById("filtro-grupos").style.display=filtroActual==="Grupo"?"flex":"none";
      if (filtroActual!=="Grupo") {
        grupoActual="todos";
        document.querySelectorAll("[data-grupo]").forEach(b=>b.classList.remove("activo"));
        const t=document.querySelector("[data-grupo='todos']"); if(t) t.classList.add("activo");
      }
      // Mostrar tabs de bracket si es fase eliminatoria
      const esElim = ["Ronda32","Octavos","Cuartos","Semifinal","Final"].includes(filtroActual);
      const esTodos = filtroActual === "todos";
      mostrarBracketTabs(esElim || esTodos);
      subtabActual = "lista";
      document.querySelectorAll("[data-subtab]").forEach(b => {
        b.classList.toggle("activo", b.dataset.subtab === "lista");
      });
      mostrarFixture();
    });
  });
  // Sub-tabs lista/bracket
  document.querySelectorAll("[data-subtab]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-subtab]").forEach(b => b.classList.remove("activo"));
      btn.classList.add("activo");
      subtabActual = btn.dataset.subtab;
      if (subtabActual === "bracket") mostrarBracket();
      else mostrarFixture();
    });
  });
  document.querySelectorAll("[data-grupo]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if (filtroActual!=="Grupo") return;
      document.querySelectorAll("[data-grupo]").forEach(b=>b.classList.remove("activo"));
      btn.classList.add("activo"); grupoActual=btn.dataset.grupo; mostrarFixture();
    });
  });
  document.getElementById("btn-m-guardar").addEventListener("click",guardarModal);
  document.getElementById("btn-m-cancelar").addEventListener("click",cerrarModal);
  document.getElementById("btn-m-borrar").addEventListener("click",borrarEdicion);
  document.getElementById("modal-overlay").addEventListener("click",e=>{if(e.target===e.currentTarget)cerrarModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarModal();});
  ["modal-g1","modal-g2"].forEach(id=>{
    document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")guardarModal();});
  });
  document.getElementById("btn-export").addEventListener("click",exportar);
  document.getElementById("btn-reset").addEventListener("click",resetear);
  document.getElementById("btn-import").addEventListener("click",()=>document.getElementById("file-import").click());
  document.getElementById("file-import").addEventListener("change",e=>{
    if(e.target.files[0]){importar(e.target.files[0]);e.target.value="";}
  });
}

async function init() {
  document.getElementById("contenido").innerHTML=
    '<div class="loading-state"><div class="spinner"></div><div>Cargando datos del torneo...</div></div>';
  await Promise.all([cargarFixture(),cargarTabla()]);
  document.getElementById("filtros-fixture").classList.add("visible");
  configurarEventos();
  mostrarFixture();
}

init();
</script>
